[package]
name = "yousef-erp"
version = "1.0.0"
description = "نظام اليوسف لإدارة المقاولات - تطبيق سطح مكتب"
authors = ["Al-Yousef Contracting"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
